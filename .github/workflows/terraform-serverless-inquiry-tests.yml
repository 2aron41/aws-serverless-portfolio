name: Terraform Serverless Inquiry Module Tests

on:
  push:
    branches:
      - main
    paths:
      - "infra/modules/serverless-inquiry/**"
      - ".github/workflows/terraform-serverless-inquiry-tests.yml"

  pull_request:
    branches:
      - main
    paths:
      - "infra/modules/serverless-inquiry/**"
      - ".github/workflows/terraform-serverless-inquiry-tests.yml"

permissions:
  contents: read

jobs:
  terraform-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/modules/serverless-inquiry

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init without backend
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform test
        run: terraform test -no-color
