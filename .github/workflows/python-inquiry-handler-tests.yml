name: Python Inquiry Handler Tests

on:
  push:
    branches:
      - main
    paths:
      - "lambda_src/**"
      - "tests/test_inquiry_handler.py"
      - "requirements.txt"
      - ".github/workflows/python-inquiry-handler-tests.yml"

  pull_request:
    branches:
      - main
    paths:
      - "lambda_src/**"
      - "tests/test_inquiry_handler.py"
      - "requirements.txt"
      - ".github/workflows/python-inquiry-handler-tests.yml"

permissions:
  contents: read

jobs:
  python-inquiry-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Python syntax check
        run: |
          python -m py_compile             lambda_src/inquiry_handler.py             tests/test_inquiry_handler.py

      - name: Run inquiry handler unit tests
        run: |
          python -m unittest             -v             tests/test_inquiry_handler.py
